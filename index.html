<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SparFuchs — Wöchentliche Supermarkt-Angebote vergleichen</title>
  <meta name="description" content="Suche echte Supermarkt-Angebote in deiner Region, markiere deine Lieblingsprodukte und finde jede Woche den günstigsten Markt." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="brand-logo">🦊</span>
        <div>
          <div class="brand-name">SparFuchs</div>
          <div class="brand-tag" id="tagline">Günstigster Supermarkt der Woche</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="regionsel" title="Region wählen">
          <span aria-hidden="true">📍</span>
          <select id="regionSelect" aria-label="Region"></select>
        </div>
        <div class="langtoggle" id="langToggle" role="tablist" aria-label="Language">
          <button type="button" class="lt" data-lang="de">DE</button>
          <button type="button" class="lt" data-lang="en">EN</button>
        </div>
        <div class="week-badge" id="weekBadge">…</div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- data readiness banner -->
    <div id="statusBanner"></div>

    <!-- this week's best deals -->
    <section class="panel hidden" id="dealsSection">
      <div class="panel-head">
        <h2 id="dealsTitle">Beste Deals diese Woche</h2>
        <span class="muted small" id="dealsSub"></span>
      </div>
      <div id="dealsRow" class="deals-row"></div>
    </section>

    <!-- search real products -->
    <section class="panel">
      <div class="panel-head">
        <h2 id="searchTitle">Produkte suchen</h2>
        <span class="muted small"><span id="realOffersLabel">echte Angebote</span> · <span id="regionLabel">–</span></span>
      </div>
      <input id="search" class="search" type="search" placeholder="Produkt suchen …" autocomplete="off" />
      <div id="searchResults" class="results"></div>
    </section>

    <!-- user favorites -->
    <section class="panel">
      <div class="panel-head">
        <h2 id="favTitle">Deine Favoriten</h2>
        <span class="muted" id="favCount">0 gespeichert</span>
      </div>
      <div id="favSummary" class="summary hidden"></div>
      <div id="favResults" class="results"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <p id="dataMeta" class="muted"></p>
    <p class="muted small" id="footerNote">Echte Prospekt-Angebote via kaufDA · nur zur Veranschaulichung · Favoriten werden lokal in deinem Browser gespeichert.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
