<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SparFuchs — Wöchentliche Supermarkt-Angebote vergleichen</title>
  <meta name="description" content="Suche echte Supermarkt-Angebote in deiner Region, markiere deine Lieblingsprodukte und finde jede Woche den günstigsten Markt." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="brand-logo">🦊</span>
        <div>
          <div class="brand-name">SparFuchs</div>
          <div class="brand-tag">Günstigster Supermarkt der Woche</div>
        </div>
      </div>
      <div class="week-badge" id="weekBadge">lädt…</div>
    </div>
  </header>

  <main class="wrap">
    <!-- data readiness banner -->
    <div id="statusBanner"></div>

    <!-- search real products -->
    <section class="panel">
      <div class="panel-head">
        <h2>Produkte suchen</h2>
        <span class="muted small">echte Angebote · <span id="regionLabel">–</span></span>
      </div>
      <input id="search" class="search" type="search" placeholder="Produkt suchen … (z. B. Monster, Joghurt, Kaffee, Barilla)" autocomplete="off" />
      <div id="searchResults" class="results"></div>
    </section>

    <!-- user favorites -->
    <section class="panel">
      <div class="panel-head">
        <h2>Deine Favoriten</h2>
        <span class="muted" id="favCount">0 gespeichert</span>
      </div>
      <div id="favSummary" class="summary hidden"></div>
      <div id="favResults" class="results"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <p id="dataMeta" class="muted"></p>
    <p class="muted small">Echte Prospekt-Angebote via kaufDA · nur zur Veranschaulichung · Favoriten werden lokal in deinem Browser gespeichert.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
