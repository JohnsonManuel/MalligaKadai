<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SparFuchs — Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .admin { max-width: 780px; margin: 0 auto; padding: 0 16px; }
    .logbox { background: #0e1013; color: #cbd3da; font-family: ui-monospace, "Cascadia Code", Menlo, monospace; font-size: 12px; line-height: 1.5; border-radius: 12px; padding: 12px 14px; height: 260px; overflow: auto; white-space: pre-wrap; border: 1px solid var(--line); margin-top: 12px; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .plz { width: 150px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 15px; }
    .btn[disabled] { opacity: .55; cursor: not-allowed; }
    .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: sp .7s linear infinite; vertical-align: -2px; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .region { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .region:last-child { border-bottom: 0; }
    .rinfo { flex: 1; min-width: 0; }
    .rzip { font-weight: 700; font-size: 14px; }
    .rmeta { font-size: 12px; color: var(--muted); }
    .rbadge { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
    .rbadge.ok { background: var(--save-bg); color: var(--save); }
    .rbadge.warn { background: color-mix(in srgb, var(--primary) 12%, var(--surface)); color: var(--primary-ink); }
    .rrefresh { padding: 6px 10px; font-size: 13px; }
    .hint { font-size: 12.5px; color: var(--primary-ink); min-height: 1.2em; }
    .dbline { font-size: 12.5px; margin-top: 6px; }
    .dbok { color: var(--save); } .dberr { color: var(--primary-ink); }
    code { background: var(--bg); padding: 1px 5px; border-radius: 5px; }
  </style>
</head>
<body>
  <header class="topbar"><div class="wrap topbar-inner">
    <div class="brand"><span class="brand-logo">🛠️</span><div>
      <div class="brand-name">SparFuchs · Admin</div>
      <div class="brand-tag">Regionen &amp; Daten-Extraktion</div>
    </div></div>
    <a class="week-badge" href="/" style="text-decoration:none">← Zur App</a>
  </div></header>

  <main class="admin">
    <section class="panel">
      <div class="panel-head"><h2>Neue Region laden</h2></div>
      <p class="muted small">Gib eine deutsche Postleitzahl ein. Wir ermitteln den Ort, holen die aktuellen kaufDA-Angebote und laden sie in die Datenbank. Dauert ~30–60&nbsp;Sekunden.</p>
      <div class="row" style="margin:12px 0 4px">
        <input id="plz" class="plz" inputmode="numeric" maxlength="5" placeholder="PLZ (z. B. 20095)" autocomplete="postal-code" />
        <button id="run" class="btn">▶ Region laden</button>
        <span id="runState" class="muted small"></span>
      </div>
      <div id="hint" class="hint"></div>
      <div id="dbline" class="dbline"></div>
      <div id="logbox" class="logbox">Noch kein Lauf in dieser Sitzung.</div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Geladene Regionen</h2><span class="muted small" id="regCount"></span></div>
      <div id="regions"><span class="muted small">lädt…</span></div>
    </section>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const esc = (s) => (s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const fmt = (d) => { try { return new Date(d).toLocaleString("de-DE"); } catch { return "—"; } };
    let pollTimer = null;
    let loadedZips = new Set();

    async function refreshRegions() {
      const r = await fetch("/api/regions").then((x) => x.json());
      loadedZips = new Set(r.regions.map((x) => x.zip));
      $("#regCount").textContent = r.regions.length ? `${r.regions.length} Region(en)` : "";
      $("#dbline").innerHTML = r.dbError
        ? `<span class="dberr">⚠ Datenbank nicht erreichbar — ${esc(r.dbError)}</span>`
        : (r.configured ? `<span class="dbok">✓ Postgres verbunden</span>` : `<span class="muted">Keine Datenbank konfiguriert (Datei-Fallback).</span>`);

      const box = $("#regions");
      if (!r.regions.length) { box.innerHTML = `<span class="muted small">Noch keine Region geladen. Gib oben eine PLZ ein.</span>`; }
      else {
        box.innerHTML = r.regions.sort((a, b) => a.zip.localeCompare(b.zip)).map((x) => `
          <div class="region">
            <div class="rinfo">
              <div class="rzip">${esc(x.zip)} · ${esc(x.city || "")}</div>
              <div class="rmeta">${x.offerCount} Angebote · ${x.brochureCount ?? "?"} Prospekte / ${x.retailers ?? "?"} Händler · gültig bis ${x.validUntil ? String(x.validUntil).slice(0,10) : "—"} · Stand ${fmt(x.generatedAt)}</div>
            </div>
            <span class="rbadge ${x.ready ? "ok" : "warn"}">${x.ready ? "bereit" : "veraltet"}</span>
            <button class="btn ghost rrefresh" data-zip="${esc(x.zip)}" ${job() ? "disabled" : ""}>↻ Aktualisieren</button>
          </div>`).join("");
        box.querySelectorAll(".rrefresh").forEach((b) => b.addEventListener("click", () => startExtract(b.dataset.zip)));
      }
      updateHint();
    }

    const job = () => !!pollTimer;

    function updateHint() {
      const plz = ($("#plz").value || "").trim();
      const loaded = loadedZips.has(plz);
      $("#run").textContent = loaded ? "↻ Aktualisieren" : "▶ Region laden";
      $("#hint").textContent = (/^\d{5}$/.test(plz) && loaded) ? "Diese Region ist bereits geladen — wird aktualisiert (neue Woche)." : "";
    }

    async function startExtract(zip) {
      if (job()) return;
      $("#run").disabled = true;
      document.querySelectorAll(".rrefresh").forEach((b) => (b.disabled = true));
      $("#runState").innerHTML = `<span class="spin"></span> Starte ${esc(zip)}…`;
      const res = await fetch("/api/extract?zip=" + encodeURIComponent(zip), { method: "POST" });
      if (res.status === 400) { const e = await res.json(); $("#runState").textContent = "✗ " + (e.error || "ungültige PLZ"); $("#run").disabled = false; return; }
      if (res.status === 409) { $("#runState").textContent = "Es läuft bereits eine Extraktion."; }
      startPolling();
    }

    async function refreshLog() {
      const r = await fetch("/api/extract/log").then((x) => x.json());
      const box = $("#logbox");
      box.textContent = r.log || "(kein Log)";
      box.scrollTop = box.scrollHeight;
      $("#runState").innerHTML = r.running ? `<span class="spin"></span> Extraktion läuft (${esc(r.zip || "")})…` : (r.finishedAt ? `Letzter Lauf: ${r.ok ? "✓ erfolgreich" : "✗ Fehler"}` : "");
      if (!r.running) { clearInterval(pollTimer); pollTimer = null; $("#run").disabled = false; refreshRegions(); }
    }
    function startPolling() { if (pollTimer) return; pollTimer = setInterval(refreshLog, 1200); refreshLog(); }

    $("#run").addEventListener("click", () => {
      const plz = ($("#plz").value || "").trim();
      if (!/^\d{5}$/.test(plz)) { $("#hint").textContent = "Bitte eine 5-stellige PLZ eingeben."; return; }
      startExtract(plz);
    });
    $("#plz").addEventListener("input", updateHint);
    $("#plz").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#run").click(); });

    refreshRegions();
    setInterval(() => { if (!job()) refreshRegions(); }, 10000);
  </script>
</body>
</html>
